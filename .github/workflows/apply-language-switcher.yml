name: Apply language switcher
on:
  push:
    branches: [main]
    paths:
      - language.js
      - .github/workflows/apply-language-switcher.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-html:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add language loader to HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          tag = '<script src=language.js defer></script>'
          changed = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if 'language.js' in text:
                  continue
              if '</head>' in text:
                  text = text.replace('</head>', '  ' + tag + '\n</head>', 1)
              elif '</body>' in text:
                  text = text.replace('</body>', tag + '\n</body>', 1)
              else:
                  continue
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))
          print('patched files:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit language loader
        run: |
          if git diff --quiet; then
            echo no html changes
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add *.html
          git commit -m 'Enable language switcher on HTML pages'
          git push